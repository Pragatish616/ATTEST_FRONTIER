[project]
name = "attest"
version = "0.1.0"
description = "ATTEST — adversarial grounding layer for agentic systems"
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.40",
    "groq>=0.13",
    "google-genai>=0.3",
    "supabase>=2.10",
    "chromadb>=0.5",
    "tavily-python>=0.5",
    "duckduckgo-search>=6.2",
    "httpx>=0.27",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["attest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["attest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
